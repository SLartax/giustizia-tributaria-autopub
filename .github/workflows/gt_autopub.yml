name: GT AutoPub

on:
  schedule:
    # 06:10 CET ~ 05:10 UTC (regola per UTC)
    - cron: "10 5 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          WP_CATEGORY_ID: ${{ secrets.WP_CATEGORY_ID }}
          WP_POST_STATUS: ${{ secrets.WP_POST_STATUS }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          GT_BASE_URL: ${{ secrets.GT_BASE_URL }}
          GT_SEARCH_PATH: ${{ secrets.GT_SEARCH_PATH }}
          GT_MAX_ITEMS_PER_RUN: ${{ secrets.GT_MAX_ITEMS_PER_RUN }}
          GT_MAX_PUBLISH_PER_RUN: ${{ secrets.GT_MAX_PUBLISH_PER_RUN }}
        run: |
          python giustizia_tributaria_autopub.py
